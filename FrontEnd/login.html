<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>Connexion - Sophie Bluel</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./assets/style.css">
	<script src="./assets/api.js" defer></script>
	<script src="./assets/login.js" defer></script>
</head>
<body class="login-page">
	<header>
		<h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
		<nav>
			<ul>
				<li><a href="./index.html#portfolio">projets</a></li>
				<li><a href="./index.html#contact">contact</a></li>
				<li><a href="./login.html" aria-current="page">login</a></li>
				<li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
			</ul>
		</nav>
	</header>
	<main>
		<section id="login">
			<h2>Log In</h2>
			<form method="post">
				<p id="login-error" role="alert" hidden></p>
				<label for="email">E-mail</label>
				<input type="email" name="email" id="email" autocomplete="username" required>
				<label for="password">Mot de passe</label>
				<input type="password" name="password" id="password" autocomplete="current-password" required>
				<button type="submit" class="login-button">Se connecter</button>
				<a class="password-reset" aria-disabled="true">Mot de passe oublié</a>
			</form>
		</section>
	</main>
	<footer>
		<nav>
			<ul>
				<li>Mentions Légales</li>
			</ul>
		</nav>
	</footer>
</body>
</html>
